name: Generate snake animation

on:
  # Redraw every night so the snake keeps eating new contributions
  schedule:
    - cron: "0 3 * * *"
  # Let you trigger it by hand from the Actions tab
  workflow_dispatch:
  # Redraw on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colours are 0-contribution first, then low -> highest (5 values).
          # These match the Tokyo Night palette used in the README.
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-tokyonight.svg?color_snake=#bf91f3&color_dots=#1a1b27,#2d3f6b,#3f5f9e,#5480d0,#70a5fd

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
